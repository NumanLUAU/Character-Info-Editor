<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Info Editor</title>
<style>
  @font-face{ font-family:'AccanthisADF Std'; src:local('AccanthisADF Std'); }
  :root{
    --panel-bg:#1b1b1b; --panel-border:#3a3a3a; --ink:#e9e4d8; --accent:#8f2a2a;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'AccanthisADF Std', Georgia, 'Times New Roman', serif;
    background:#111; color:var(--ink); display:flex; min-height:100vh;
  }
  #editor{
    width:420px; min-width:340px; max-width:44vw; background:var(--panel-bg);
    border-right:1px solid var(--panel-border); overflow-y:auto; padding:16px;
  }
  #editor h1{font-size:18px; margin:0 0 14px; letter-spacing:1px;}
  .sectionHead{font-size:11px; color:#c89614; margin:0 0 8px; font-weight:700; letter-spacing:1px; text-transform:uppercase;}
  #configSection{background:#222; border:1px solid #3a3a3a; border-radius:6px; padding:10px; margin-bottom:16px;}
  #configKeys .field{margin-bottom:6px;}
  .cfgGroup{font-size:11px; color:#c89614; margin:8px 0 2px; font-weight:700;}
  #entries{display:flex; flex-direction:column; gap:10px;}
  .entry{background:#222; border:1px solid #3a3a3a; border-radius:6px; padding:10px;}
  .entry-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .entry-head span{font-size:12px; color:#aaa;}
  .entry-head .btns button{
    background:#333; color:#ddd; border:1px solid #444; border-radius:4px;
    font-size:11px; padding:3px 6px; margin-left:4px; cursor:pointer;
  }
  .entry-head .btns button:hover{background:#3d3d3d;}
  .field{margin-bottom:6px;}
  .field label{display:block; font-size:11px; color:#bbb; margin-bottom:2px;}
  .field input[type=text], .field textarea{
    width:100%; background:#141414; border:1px solid #3a3a3a; color:#eee;
    border-radius:4px; padding:5px 6px; font-family:inherit; font-size:12px;
  }
  .field textarea{min-height:52px; resize:vertical;}
  #addEntry, .actionBtn{
    width:100%; padding:9px; margin-top:6px; background:var(--accent); color:#fff;
    border:none; border-radius:5px; font-size:13px; cursor:pointer; letter-spacing:.5px;
  }
  #addEntry:hover, .actionBtn:hover{filter:brightness(1.15);}
  .btnRow{display:flex; gap:6px;}
  .btnRow .actionBtn{background:#3a3a3a;}
  #ioWrap{position:sticky; bottom:0; background:var(--panel-bg); padding-top:10px; display:flex; flex-direction:column; gap:6px;}
  #preview-col{flex:1; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;}
  #frame{
    width:660px; max-width:100%; background:#17140f; border:2px solid #000;
    box-shadow:0 0 0 3px #444, 0 10px 30px rgba(0,0,0,.6); padding:0 0 18px; min-height:300px;
  }
  .sep-bar{ background:#000; padding:10px 0; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .sep-bar span{color:#fff; font-weight:700; letter-spacing:2px; font-size:16px; text-transform:uppercase;}
  .block{padding:0 22px 16px;}
  .hdr{font-size:34px; font-weight:700; color:#f2ede0; margin:2px 0 4px; line-height:1;}
  .quote{font-style:italic; color:#c9c2ae; font-size:13px; margin:0 0 8px;}
  .txtrow{display:flex; gap:14px; align-items:flex-start;}
  .icon{
    width:74px; height:74px; flex:none; border-radius:50%; background:#333;
    border:2px solid #cfc9b8; display:flex; align-items:center; justify-content:center;
    font-size:9px; color:#8a8574; text-align:center; overflow:hidden; padding:4px; word-break:break-all;
  }
  .txt{font-size:14px; line-height:1.5; color:#eee; flex:1;}
  .empty-msg{color:#777; text-align:center; padding:60px 20px; font-size:13px;}
  #modal, #importModal{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:10;
    align-items:center; justify-content:center; padding:20px;
  }
  #modal.show, #importModal.show{display:flex;}
  .modalBox{
    background:#1b1b1b; border:1px solid #444; border-radius:8px; padding:16px;
    width:min(720px,100%); max-height:80vh; display:flex; flex-direction:column; gap:10px;
  }
  .modalBox h3{margin:0; font-size:14px; color:#ddd;}
  #codeOut{
    flex:1; min-height:300px; background:#0e0e0e; color:#c9e6a8; font-family:monospace;
    font-size:12px; border:1px solid #333; border-radius:5px; padding:10px; overflow:auto; white-space:pre;
  }
  #importText{
    flex:1; min-height:300px; background:#0e0e0e; color:#ddd; font-family:monospace;
    font-size:12px; border:1px solid #333; border-radius:5px; padding:10px; resize:vertical;
  }
  #importErr{color:#e88; font-size:12px; min-height:14px;}
  .modalBtns{display:flex; gap:8px; justify-content:flex-end;}
  .modalBtns button{
    background:#333; color:#eee; border:1px solid #444; border-radius:5px; padding:7px 14px;
    font-size:12px; cursor:pointer;
  }
  @media (max-width:760px){
    body{flex-direction:column;}
    #editor{width:100%; max-width:100%; border-right:none; border-bottom:1px solid var(--panel-border);}
  }
</style>
</head>
<body>

<div id="editor">
  <h1>INFO EDITOR</h1>

  <div id="configSection">
    <div class="sectionHead">Config</div>
    <div class="field">
      <label>Config name (auto-detected, editable)</label>
      <input type="text" id="configNameInput" placeholder="killerConfig">
    </div>
    <div id="configKeys"></div>
  </div>

  <div class="sectionHead">Entries</div>
  <div id="entries"></div>
  <button id="addEntry">+ Add Entry</button>
  <div id="ioWrap">
    <div class="btnRow"><button class="actionBtn" id="importLuaBtn">Import LUAU</button><button class="actionBtn" id="exportLuaBtn">Export LUAU</button></div>
    <div class="btnRow"><button class="actionBtn" id="importJsonBtn">Import JSON</button><button class="actionBtn" id="exportJsonBtn">Export JSON</button></div>
  </div>
</div>

<div id="preview-col"><div id="frame"></div></div>

<div id="modal">
  <div class="modalBox">
    <h3 id="modalTitle">Export</h3>
    <div id="codeOut"></div>
    <div class="modalBtns"><button id="copyBtn">Copy</button><button id="closeModal">Close</button></div>
  </div>
</div>

<div id="importModal">
  <div class="modalBox">
    <h3 id="importTitle">Import</h3>
    <textarea id="importText" placeholder="Paste here..."></textarea>
    <div id="importErr"></div>
    <div class="modalBtns"><button id="loadImportBtn">Load</button><button id="closeImport">Cancel</button></div>
  </div>
</div>

<script>
let entries = [
  {separator:"GENERAL INFO"},
  {header:"JASON", text:"A man who's identity is covered by a crude hockey mask.\nHealth: {killerConfig.Health}"}
];
let configStore = {};        // { prefix: { key: value } }
let varStore = {};           // { name: value }  (bare {killerName}-style placeholders)
let defaultsStore = {};      // { prefix: { key: defaultLiteral } }  from "{prefix.key or default}"
let varDefaults = {};        // { name: defaultLiteral }             from "{name or default}"
let configName = '';
let configNameManual = false;
let lastKeyStr = '';

const entriesEl = document.getElementById('entries');
const frameEl = document.getElementById('frame');

/* ---------- helpers ---------- */
function isNoImage(v){
  const t = (v||'').trim().toLowerCase();
  return t==='' || t==='nil' || t==='rbxassetid://0';
}
let thumbCache = {};
function loadThumb(assetId){
  if(thumbCache[assetId] !== undefined) return Promise.resolve(thumbCache[assetId]);
  return fetch(`https://thumbnails.roproxy.com/v1/assets?assetIds=${assetId}&returnPolicy=PlaceHolder&size=420x420&format=png`)
    .then(r=>r.json())
    .then(data=>{
      const url = (data && data.data && data.data[0] && data.data[0].imageUrl) || null;
      thumbCache[assetId] = url;
      return url;
    })
    .catch(()=>{ thumbCache[assetId] = null; return null; });
}
function makeIcon(imageVal){
  const icon = document.createElement('div'); icon.className = 'icon';
  const idMatch = /rbxassetid:\/\/(\d+)/i.exec(imageVal || '');
  const fallback = document.createElement('span');
  fallback.textContent = imageVal;
  icon.appendChild(fallback);
  if(idMatch){
    const img = document.createElement('img');
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;display:none;';
    icon.insertBefore(img, fallback);
    loadThumb(idMatch[1]).then(url => {
      if(url){ img.src = url; img.style.display = 'block'; fallback.style.display = 'none'; }
    });
  }
  return icon;
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* Matches {prefix.key}, {prefix.key or default}, {name}, {name or default} */
const PLACEHOLDER_RE = /\{([A-Za-z_][A-Za-z0-9_]*)(?:\.([A-Za-z_][A-Za-z0-9_]*))?(?:\s+or\s+([^}]+?))?\}/g;
function parseDefault(raw){
  if(raw === undefined) return undefined;
  let d = raw.trim();
  if((d.startsWith('"')&&d.endsWith('"')) || (d.startsWith("'")&&d.endsWith("'"))) d = d.slice(1,-1);
  return d;
}
function resolveText(str){
  if(!str) return str;
  return str.replace(PLACEHOLDER_RE, (m, ident, key, defRaw) => {
    const def = defRaw !== undefined ? parseDefault(defRaw) : undefined;
    if(key){
      const v = configStore[ident] && configStore[ident][key];
      if(v !== undefined && v !== '') return v;
      const d = defaultsStore[ident] && defaultsStore[ident][key];
      return d !== undefined ? d : (def !== undefined ? def : m);
    }
    const v = varStore[ident];
    if(v !== undefined && v !== '') return v;
    const d = varDefaults[ident];
    return d !== undefined ? d : (def !== undefined ? def : m);
  });
}

/* ---------- entry editor ---------- */
function fieldRow(entry, key, kind, ph){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const label = document.createElement('label');
  label.textContent = key[0].toUpperCase()+key.slice(1);
  wrap.appendChild(label);
  const input = document.createElement(kind === 'area' ? 'textarea' : 'input');
  if(kind !== 'area') input.type = 'text';
  input.placeholder = ph || '';
  input.value = entry[key] || '';
  input.addEventListener('input', () => { entry[key] = input.value; render(); });
  wrap.appendChild(input);
  return wrap;
}
function mkBtn(label, onClick){
  const b = document.createElement('button');
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}
function renderEditor(){
  entriesEl.innerHTML = '';
  entries.forEach((entry, idx) => {
    const box = document.createElement('div');
    box.className = 'entry';
    const head = document.createElement('div');
    head.className = 'entry-head';
    head.innerHTML = `<span>Entry ${idx+1}</span>`;
    const btns = document.createElement('div');
    btns.className = 'btns';
    btns.appendChild(mkBtn('↑', () => { if(idx>0){[entries[idx-1],entries[idx]]=[entries[idx],entries[idx-1]]; renderEditor(); render();}}));
    btns.appendChild(mkBtn('↓', () => { if(idx<entries.length-1){[entries[idx+1],entries[idx]]=[entries[idx],entries[idx+1]]; renderEditor(); render();}}));
    btns.appendChild(mkBtn('Dup', () => { entries.splice(idx+1,0,JSON.parse(JSON.stringify(entry))); renderEditor(); render();}));
    btns.appendChild(mkBtn('✕', () => { entries.splice(idx,1); renderEditor(); render();}));
    head.appendChild(btns);
    box.appendChild(head);
    box.appendChild(fieldRow(entry, 'separator', 'text', 'e.g. GENERAL INFO'));
    box.appendChild(fieldRow(entry, 'header', 'text', 'e.g. JASON'));
    box.appendChild(fieldRow(entry, 'quote', 'text', 'e.g. "Make them remember!" - Mother'));
    box.appendChild(fieldRow(entry, 'image', 'text', 'rbxassetid://... (nil or rbxassetid://0 = no image)'));
    box.appendChild(fieldRow(entry, 'text', 'area', 'Body text. <font color="rgb(200,150,20)">tag</font>, <b>bold</b>, {killerConfig.Field}'));
    entriesEl.appendChild(box);
  });
}
document.getElementById('addEntry').addEventListener('click', () => { entries.push({}); renderEditor(); render(); });

/* ---------- config scan + UI ---------- */
function scanPlaceholders(){
  const found = []; const seen = new Set(); const freq = {};
  entries.forEach(e=>{
    ['separator','header','quote','text'].forEach(f=>{
      const val = e[f]; if(!val) return;
      let m; PLACEHOLDER_RE.lastIndex = 0;
      while((m = PLACEHOLDER_RE.exec(val))){
        const ident=m[1], key=m[2], defRaw=m[3];
        const def = defRaw !== undefined ? parseDefault(defRaw) : undefined;
        if(key){
          const id = 'p:'+ident+'.'+key;
          freq[ident] = (freq[ident]||0)+1;
          if(!seen.has(id)){ seen.add(id); found.push({type:'prefixed', prefix:ident, key, default:def}); }
          if(def !== undefined){ defaultsStore[ident] = defaultsStore[ident]||{}; if(!(key in defaultsStore[ident])) defaultsStore[ident][key]=def; }
        } else {
          const id = 'v:'+ident;
          if(!seen.has(id)){ seen.add(id); found.push({type:'var', name:ident, default:def}); }
          if(def !== undefined && !(ident in varDefaults)) varDefaults[ident] = def;
        }
      }
    });
  });
  return {found, freq};
}
function updateConfig(){
  const {found, freq} = scanPlaceholders();
  found.forEach(f=>{
    if(f.type === 'prefixed'){
      configStore[f.prefix] = configStore[f.prefix] || {};
      if(!(f.key in configStore[f.prefix])) configStore[f.prefix][f.key] = '';
    } else {
      if(!(f.name in varStore)) varStore[f.name] = '';
    }
  });
  let dominant = ''; let max = 0;
  Object.keys(freq).forEach(p=>{ if(freq[p] > max){ max = freq[p]; dominant = p; } });
  if(!configNameManual && dominant) configName = dominant;
  const keyStr = found.map(f=> f.type==='prefixed' ? ('p:'+f.prefix+'.'+f.key) : ('v:'+f.name)).join('|');
  const changed = keyStr !== lastKeyStr;
  lastKeyStr = keyStr;
  return {found, changed};
}
function renderConfigKeys(found){
  const wrap = document.getElementById('configKeys');
  wrap.innerHTML = '';
  if(found.length === 0){
    wrap.innerHTML = '<div style="color:#777; font-size:12px; padding:4px 0;">No {config.Key} or {name} placeholders detected yet.</div>';
    return;
  }
  let curGroup = null;
  found.forEach(f=>{
    const groupLabel = f.type === 'prefixed' ? f.prefix : 'Names';
    if(groupLabel !== curGroup){
      curGroup = groupLabel;
      const h = document.createElement('div'); h.className='cfgGroup'; h.textContent = groupLabel;
      wrap.appendChild(h);
    }
    const row = document.createElement('div'); row.className = 'field';
    const label = document.createElement('label'); label.textContent = f.type === 'prefixed' ? f.key : f.name;
    const input = document.createElement('input'); input.type = 'text';
    const def = f.type === 'prefixed' ? (defaultsStore[f.prefix] && defaultsStore[f.prefix][f.key]) : varDefaults[f.name];
    input.placeholder = def !== undefined ? `default: ${def}` : 'value for preview';
    input.value = f.type === 'prefixed' ? (configStore[f.prefix][f.key] || '') : (varStore[f.name] || '');
    input.addEventListener('input', () => {
      if(f.type === 'prefixed') configStore[f.prefix][f.key] = input.value;
      else varStore[f.name] = input.value;
      renderPreview();
    });
    row.appendChild(label); row.appendChild(input);
    wrap.appendChild(row);
  });
}
const configNameInput = document.getElementById('configNameInput');
configNameInput.addEventListener('input', () => { configName = configNameInput.value; configNameManual = true; });
function syncConfigNameField(){
  if(!configNameManual && document.activeElement !== configNameInput){
    configNameInput.value = configName;
  }
}

/* ---------- preview ---------- */
function renderPreview(){
  frameEl.innerHTML = '';
  if(entries.length === 0){
    frameEl.innerHTML = '<div class="empty-msg">No entries yet. Add one on the left.</div>';
    return;
  }
  entries.forEach(entry => {
    if(entry.separator){
      const bar = document.createElement('div'); bar.className = 'sep-bar';
      bar.innerHTML = `<span>${escapeHtml(resolveText(entry.separator))}</span>`;
      frameEl.appendChild(bar);
    }
    if(entry.header || entry.quote || entry.text){
      const block = document.createElement('div'); block.className = 'block';
      if(entry.header){
        const h = document.createElement('div'); h.className='hdr'; h.textContent = resolveText(entry.header);
        block.appendChild(h);
      }
      if(entry.quote){
        const q = document.createElement('div'); q.className='quote'; q.textContent = resolveText(entry.quote);
        block.appendChild(q);
      }
      if(entry.text){
        const row = document.createElement('div'); row.className='txtrow';
        if(!isNoImage(entry.image)){
          row.appendChild(makeIcon(entry.image));
        }
        const t = document.createElement('div'); t.className='txt';
        t.innerHTML = resolveText(entry.text).replace(/\n/g,'<br>');
        row.appendChild(t);
        block.appendChild(row);
      }
      frameEl.appendChild(block);
    }
  });
}
function render(){
  const {found, changed} = updateConfig();
  if(changed) renderConfigKeys(found);
  syncConfigNameField();
  renderPreview();
}

/* ---------- LUAU export ---------- */
function luaEscape(str){
  return String(str).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\r\n/g,'\n').replace(/\n/g,'\\n');
}
function luaQuoted(s){ return '"' + String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '"'; }
function luaBacktick(s){ return '`' + luaEscape(s) + '`'; }
function buildLua(){
  const head = configName ? `${configName}.Information` : 'Information';
  let out = `${head} = {\n`;
  entries.forEach(entry => {
    out += '\t{\n';
    if(entry.separator) out += `\t\tSeparator = ${luaQuoted(entry.separator)};\n`;
    if(entry.header) out += `\t\tHeader = ${luaQuoted(entry.header)};\n`;
    if(entry.quote) out += `\t\tQuote = ${luaBacktick(entry.quote)};\n`;
    if(entry.image){
      const t = entry.image.trim().toLowerCase();
      out += t === 'nil' ? '\t\tImage = nil;\n' : `\t\tImage = ${luaQuoted(entry.image)};\n`;
    }
    if(entry.text) out += `\t\tText = ${luaBacktick(entry.text + '\n')}\n`;
    out += '\t};\n';
  });
  out += '};';
  return out;
}

/* ---------- LUAU import (mini parser) ---------- */
function luaUnescape(str){ return str.replace(/\\(.)/g,(m,c)=>c==='n'?'\n':c==='t'?'\t':c==='r'?'\r':c); }
function parseLuaTable(src, startPos){
  let i = startPos !== undefined ? startPos : 0; const n = src.length;
  function skipWs(){
    while(i<n){
      const c = src[i];
      if(c===' '||c==='\t'||c==='\n'||c==='\r'){ i++; continue; }
      if(c==='-'&&src[i+1]==='-'){
        if(src[i+2]==='['&&src[i+3]==='['){ i+=4; const end=src.indexOf(']]',i); i = end===-1? n : end+2; continue; }
        while(i<n && src[i]!=='\n') i++;
        continue;
      }
      break;
    }
  }
  function readDelim(close){
    i++; let out = '';
    while(i<n){
      const c = src[i];
      if(c==='\\'){ out += c + (src[i+1]||''); i+=2; continue; }
      if(c===close){ i++; return luaUnescape(out); }
      out += c; i++;
    }
    return luaUnescape(out);
  }
  function readBareToken(){
    let out=''; let depth=0;
    while(i<n){
      const c = src[i];
      if(depth===0 && (c===';'||c===','||c==='}')) break;
      if(c==='{') depth++;
      if(c==='}') depth--;
      out += c; i++;
    }
    return out.trim();
  }
  function readStringPiece(){
    skipWs();
    if(src[i]==='"'||src[i]==="'") return readDelim(src[i]);
    if(src[i]==='`') return readDelim('`');
    return null;
  }
  function readValue(){
    skipWs();
    const c = src[i];
    if(c==='{') return readTable();
    if(c==='"'||c==="'") return readDelim(c);
    if(c==='`'){
      let v = readDelim('`'); skipWs();
      while(src[i]==='.'&&src[i+1]==='.'){
        i+=2; const piece = readStringPiece();
        if(piece===null) break;
        v += piece; skipWs();
      }
      return v;
    }
    return readBareToken();
  }
  function looksLikeAssign(){
    const m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(src.slice(i));
    if(!m) return false;
    let j = i + m[0].length;
    while(j<n && /\s/.test(src[j])) j++;
    return (src[j]==='=' && src[j+1]!=='=') ? m[0] : false;
  }
  function readTable(){
    i++; const arr = []; const obj = {};
    skipWs();
    while(i<n && src[i]!=='}'){
      skipWs();
      if(src[i]==='}') break;
      const key = looksLikeAssign();
      if(key){ i += key.length; skipWs(); i++; obj[key] = readValue(); }
      else arr.push(readValue());
      skipWs();
      if(src[i]===';'||src[i]===','){ i++; skipWs(); }
    }
    if(src[i]==='}') i++;
    if(arr.length && !Object.keys(obj).length) return arr;
    if(Object.keys(obj).length && !arr.length) return obj;
    return {__arr:arr, __obj:obj};
  }
  skipWs();
  if(startPos === undefined){
    const braceIdx = src.indexOf('{', i);
    if(braceIdx === -1) throw new Error('No table found in pasted text.');
    i = braceIdx;
  }
  return readTable();
}
function tableToEntries(t){
  const list = Array.isArray(t) ? t : (t && t.__arr) ? t.__arr : [];
  return list.map(rec => {
    if(typeof rec !== 'object' || rec===null) return {};
    const get = k => rec[k] ?? rec[k.toLowerCase()] ?? '';
    return {
      separator: get('Separator'), header: get('Header'), quote: get('Quote'),
      image: get('Image'), text: String(get('Text')||'').replace(/\n$/,'')
    };
  });
}
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function cleanConfigValue(raw){
  let v = String(raw).trim();
  const orMatch = v.match(/\bor\s+([\s\S]+)$/);
  if(orMatch) v = orMatch[1].trim();
  if(v.length>=2){
    const first=v[0], last=v[v.length-1];
    if((first==='"'&&last==='"')||(first==="'"&&last==="'")||(first==='`'&&last==='`')) v = v.slice(1,-1);
  }
  return v;
}
/* Parses a full module paste: finds `<name>.Information = {...}` for entries,
   and `local <name> = {...}` for the config table to autofill preview values. */
function loadLuaModule(raw){
  let entries = null, cfgPrefix = '', cfgValues = null;

  const infoMatch = /([A-Za-z_][A-Za-z0-9_]*)\.Information\s*=\s*\{/.exec(raw);
  if(infoMatch){
    cfgPrefix = infoMatch[1];
    const braceIdx = infoMatch.index + infoMatch[0].length - 1;
    entries = tableToEntries(parseLuaTable(raw, braceIdx));
  }

  const localRe = cfgPrefix
    ? new RegExp('local\\s+' + escapeRegExp(cfgPrefix) + '\\s*=\\s*\\{')
    : /local\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*\{/;
  const localMatch = localRe.exec(raw);
  if(localMatch){
    if(!cfgPrefix) cfgPrefix = localMatch[1];
    const braceIdx = localMatch.index + localMatch[0].length - 1;
    const tbl = parseLuaTable(raw, braceIdx);
    if(tbl && !Array.isArray(tbl) && !tbl.__arr){
      cfgValues = {};
      Object.keys(tbl).forEach(k=>{
        if(typeof tbl[k] === 'string') cfgValues[k] = cleanConfigValue(tbl[k]);
      });
    }
  }

  if(!entries) entries = tableToEntries(parseLuaTable(raw));
  return {entries, cfgPrefix, cfgValues};
}

/* ---------- export/import modals ---------- */
const modal = document.getElementById('modal');
function openExport(title, text){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('codeOut').textContent = text;
  modal.classList.add('show');
}
document.getElementById('exportLuaBtn').addEventListener('click', () => openExport('Information Table (Luau)', buildLua()));
document.getElementById('exportJsonBtn').addEventListener('click', () => openExport('Entries (JSON)', JSON.stringify({entries, configName, configStore, varStore}, null, 2)));
document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('show'));
document.getElementById('copyBtn').addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(document.getElementById('codeOut').textContent);
    const btn = document.getElementById('copyBtn'); const old = btn.textContent;
    btn.textContent = 'Copied!'; setTimeout(()=>btn.textContent=old, 1200);
  }catch(e){}
});

const importModal = document.getElementById('importModal');
let importMode = 'lua';
function openImport(mode){
  importMode = mode;
  document.getElementById('importTitle').textContent = mode==='lua' ? 'Import LUAU' : 'Import JSON';
  document.getElementById('importText').value = '';
  document.getElementById('importErr').textContent = '';
  importModal.classList.add('show');
}
document.getElementById('importLuaBtn').addEventListener('click', () => openImport('lua'));
document.getElementById('importJsonBtn').addEventListener('click', () => openImport('json'));
document.getElementById('closeImport').addEventListener('click', () => importModal.classList.remove('show'));
document.getElementById('loadImportBtn').addEventListener('click', () => {
  const raw = document.getElementById('importText').value;
  const errEl = document.getElementById('importErr');
  errEl.textContent = '';
  try{
    if(importMode === 'lua'){
      const {entries: parsed, cfgPrefix, cfgValues} = loadLuaModule(raw);
      if(!parsed.length) throw new Error('No entries found. check the pasted table.');
      entries = parsed; configStore = {}; varStore = {}; defaultsStore = {}; varDefaults = {}; lastKeyStr = '';
      if(cfgPrefix){
        configName = cfgPrefix; configNameManual = true;
        if(cfgValues){ configStore[cfgPrefix] = {}; Object.keys(cfgValues).forEach(k=>{ configStore[cfgPrefix][k] = cfgValues[k]; }); }
      } else {
        configNameManual = false;
      }
    } else {
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        entries = parsed.map(e => ({separator:e.separator||'', header:e.header||'', quote:e.quote||'', image:e.image||'', text:e.text||''}));
        configStore = {}; varStore = {}; configNameManual = false;
      } else if(parsed && Array.isArray(parsed.entries)){
        entries = parsed.entries.map(e => ({separator:e.separator||'', header:e.header||'', quote:e.quote||'', image:e.image||'', text:e.text||''}));
        configStore = parsed.configStore || {};
        varStore = parsed.varStore || {};
        configName = parsed.configName || '';
        configNameManual = !!configName;
      } else throw new Error('JSON must be an array of entries, or an object with an "entries" array.');
      defaultsStore = {}; varDefaults = {}; lastKeyStr = '';
    }
    renderEditor(); render();
    importModal.classList.remove('show');
  }catch(e){
    errEl.textContent = 'Could not parse: ' + e.message;
  }
});

renderEditor();
render();
</script>
